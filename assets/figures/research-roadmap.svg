<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="335" viewBox="0 0 1230 335" role="img" aria-label="Current DFS and conditional future research stages">
<title>Current DFS and conditional future research stages</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#172638}.title{font-size:29px;font-weight:700}.heading{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.label{font-size:12px;fill:#64748b}.pill{font-size:13px;font-weight:700;fill:#166534}</style>
<rect width="100%" height="100%" fill="#fff"/><text x="32" y="45" class="title">Search before learning</text><text x="32" y="77" class="body">Solid = implemented baseline. Dashed = research proposal, not a measured result.</text><rect x="32" y="130" width="205" height="140" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" /><text x="52" y="166" class="heading">DFS baseline</text><text x="52" y="200" class="body">Fix revision / config</text><text x="52" y="227" class="body">Replay current rules</text><rect x="271" y="130" width="205" height="140" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" /><text x="291" y="166" class="heading">Benchmark first</text><text x="291" y="200" class="body">Seeds / simulator</text><text x="291" y="227" class="body">Budget / evaluation</text><rect x="510" y="130" width="205" height="140" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/><text x="530" y="166" class="heading">Beam Search</text><text x="530" y="200" class="body">Width / horizon</text><text x="530" y="227" class="body">Same time budget</text><rect x="749" y="130" width="205" height="140" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/><text x="769" y="166" class="heading">MCTS</text><text x="769" y="200" class="body">Chance / rollout</text><text x="769" y="227" class="body">Validated dynamics</text><rect x="988" y="130" width="205" height="140" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/><text x="1008" y="166" class="heading">ML / RL</text><text x="1008" y="200" class="body">Policy / value hybrid</text><text x="1008" y="227" class="body">Only if justified</text><path d="M239 200 L267 200" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M478 200 L506 200" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M717 200 L745 200" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M956 200 L984 200" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="32" y="308" class="small">Advance only after reproducible limitations, fair comparisons, and a separately approved experiment.</text></svg>
