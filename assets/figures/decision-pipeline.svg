<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="565" viewBox="0 0 1120 565" role="img" aria-label="Implemented observation review search and replay boundaries">
<title>Implemented observation review search and replay boundaries</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#172638}.title{font-size:29px;font-weight:700}.heading{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.label{font-size:12px;fill:#64748b}.pill{font-size:13px;font-weight:700;fill:#166534}</style>
<rect width="100%" height="100%" fill="#fff"/><text x="38" y="46" class="title">Observation to a verified decision</text><text x="38" y="79" class="body">All boxes describe implemented responsibilities. Game control remains manual.</text><rect x="38" y="128" width="310" height="155" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" /><text x="58" y="164" class="heading">1. Local observation</text><text x="58" y="198" class="body">Manual input or shared frame</text><text x="58" y="225" class="body">Board / pieces / abilities</text><rect x="405" y="128" width="310" height="155" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" /><text x="425" y="164" class="heading">2. Explicit review</text><text x="425" y="198" class="body">Resolve uncertain cells / items</text><text x="425" y="225" class="body">Validate the confirmed state</text><rect x="772" y="128" width="310" height="155" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" /><text x="792" y="164" class="heading">3. Bounded DFS</text><text x="792" y="198" class="body">Shared 512-node default budget</text><text x="792" y="225" class="body">Rank replayable candidates</text><path d="M350 205 L400 205" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M717 205 L767 205" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M926 287 L926 363" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="772" y="368" width="310" height="147" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" /><text x="792" y="404" class="heading">4. App state replay</text><text x="792" y="438" class="body">Apply Step / snapshot guards</text><text x="792" y="465" class="body">Does not operate the game</text><rect x="405" y="368" width="310" height="147" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" /><text x="425" y="404" class="heading">5. User plays game</text><text x="425" y="438" class="body">Place / use ability manually</text><text x="425" y="465" class="body">Observe the actual outcome</text><rect x="38" y="368" width="310" height="147" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" /><text x="58" y="404" class="heading">6. Read next state</text><text x="58" y="438" class="body">Next pieces / reroll observation</text><text x="58" y="465" class="body">Return to explicit review</text><path d="M768 438 L722 438" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M401 438 L356 438" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M193 365 L193 290" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><text x="38" y="547" class="small">Recognition is a draft, not state approval. Awaiting input is not a game-over result.</text></svg>
